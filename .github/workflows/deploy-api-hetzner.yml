name: Deploy API to Hetzner

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-api-hetzner.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API (luxury-api-prod)
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || 22 }}
          script_stop: true
          script: |
            cd /opt/pitaya/luxuryos

            if [ ! -d .git ]; then
              echo "El directorio no es un clon de git. Clona el repo una vez en el servidor."
              exit 1
            fi

            echo "[1/4] Actualizando repositorio..."
            git fetch origin main
            git reset --hard origin/main

            echo "[2/5] Construyendo la imagen de API..."
            docker compose --env-file .env.prod -f docker-compose.prod.yml build api

            echo "[3/5] Aplicando únicamente migraciones versionadas..."
            docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm --no-deps api npx prisma migrate deploy

            echo "[4/5] Reiniciando luxury-api-prod con la imagen validada..."
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --no-deps api

            echo "[5/5] Verificando estado..."
            sleep 5
            docker ps --filter name=luxury-api-prod
            docker logs --tail 20 luxury-api-prod
