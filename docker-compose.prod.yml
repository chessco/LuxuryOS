services:
  mysql:
    image: mysql:8
    container_name: luxury-mysql-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - pitaya_net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: luxury-api-prod
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${PORT}:3002"
    environment:
      - DATABASE_URL=mysql://root:${DB_ROOT_PASSWORD}@mysql:3306/${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3002
      - NODE_ENV=production
      # Asistente Aura (PitayaCore). Los valores se definen en el .env del servidor, nunca en el repo.
      - PITAYACORE_API_URL=${PITAYACORE_API_URL:-}
      - PITAYACORE_API_KEY=${PITAYACORE_API_KEY:-}
      # Herramientas de consulta de Aura (solo administradores). Apagado por defecto.
      - AURA_TOOLS_ENABLED=${AURA_TOOLS_ENABLED:-false}
      - AURA_TOOLS_SECRET=${AURA_TOOLS_SECRET:-}
      - AURA_TOOLS_CALLBACK_URL=${AURA_TOOLS_CALLBACK_URL:-}
    volumes:
      - uploads_prod_data:/app/uploads
    networks:
      - pitaya_net

networks:
  pitaya_net:
    external: true

volumes:
  mysql_prod_data:
  uploads_prod_data:
