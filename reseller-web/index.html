<!doctype html>
<html lang="es" class="theme-cared dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0c" />
    <title>Revendedores | Cared</title>
    <script>
      try {
        const variant = localStorage.getItem('theme-variant');
        const mode = localStorage.getItem('theme-mode');
        const supported = ['pitaya', 'notion', 'cared'];
        const selected = supported.includes(variant) ? variant : 'cared';
        const effectiveMode = selected === 'cared' ? 'dark' : (mode === 'dark' ? 'dark' : 'light');
        document.documentElement.className = `theme-${selected} ${effectiveMode}`;
      } catch (error) {
        document.documentElement.className = 'theme-cared dark';
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,100..900&family=Inter:wght@100..900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
