services:
  mysql:
    image: mysql:8
    container_name: luxury-pos-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: local-pos-root
      MYSQL_DATABASE: luxury_pos_test
      MYSQL_USER: luxury_pos
      MYSQL_PASSWORD: luxury_pos
    ports:
      - "3310:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -plocal-pos-root"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - luxury-pos-test-mysql:/var/lib/mysql

volumes:
  luxury-pos-test-mysql:
